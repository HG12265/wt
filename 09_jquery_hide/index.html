<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hide Paragraph using jQuery</title>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <script>
        $(document).ready(function () {
            $("#hideBtn").click(function () {
                $("#about").hide();
            });

            $("#showBtn").click(function () {
                $("#about").show();
            });
        });
    </script>

    <style>
        body {
            font-family: Arial;
            padding: 40px;
            background: #f8fafc;
        }

        .box {
            max-width: 750px;
            background: #fff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 7px 22px rgba(0, 0, 0, .08);
        }

        button {
            padding: 10px 16px;
            margin-right: 8px;
            border: 0;
            border-radius: 7px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="box">
        <h2>Hide Paragraph Example using jQuery</h2>

        <p id="about">
            G. Gowtham is an MCA candidate at Periyar University with interests in
            full-stack web development, software engineering, backend development
            and database-driven applications.
        </p>

        <button id="hideBtn">Hide Paragraph</button>
        <button id="showBtn">Show Paragraph</button>
    </div>
</body>
</html>
