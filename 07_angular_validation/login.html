<!DOCTYPE html>
<html lang="en" ng-app><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>AngularJS Validation</title><script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script><style>body{font-family:Arial;background:#eef2ff}.box{width:380px;margin:70px auto;background:#fff;padding:25px;border-radius:14px;box-shadow:0 10px 28px rgba(0,0,0,.1)}input{width:100%;padding:11px;margin:7px 0 4px;box-sizing:border-box}.error{color:#dc2626;font-size:13px}.success{color:#059669}button{width:100%;padding:11px;background:#4f46e5;color:white;border:0;border-radius:8px;margin-top:12px}button:disabled{opacity:.5}</style></head>
<body><div class="box"><h2>Gowtham Portfolio Login</h2><form name="loginForm" novalidate><label>Email</label><input type="email" name="email" ng-model="email" required><div class="error" ng-show="loginForm.email.$touched && loginForm.email.$error.required">Email is required</div><div class="error" ng-show="loginForm.email.$error.email">Invalid email format</div><br><label>Password</label><input type="password" name="password" ng-model="password" required ng-minlength="6"><div class="error" ng-show="loginForm.password.$touched && loginForm.password.$error.required">Password is required</div><div class="error" ng-show="loginForm.password.$error.minlength">Minimum 6 characters required</div><p class="success" ng-show="loginForm.$valid">All fields look good!</p><button type="submit" ng-disabled="loginForm.$invalid">Login</button></form></div></body></html>
